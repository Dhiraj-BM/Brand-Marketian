<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Login | Brand Marketian</title>
<meta name="description" content="The Brand Marketian client portal is on the way. In the meantime, your growth team is one message away.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="brand.css">
<style>
  .cl-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
    background:radial-gradient(1000px 500px at 50% -10%, var(--color-accent-100, #fff2e8), transparent), var(--color-bg, #fff)}
  .cl-card{max-width:520px;width:100%;text-align:center}
  .cl-badge{display:inline-block;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--color-accent-700, #b34300);background:var(--color-accent-100, #fff2e8);padding:6px 12px;border-radius:999px}
  .cl-card h1{font-size:40px;line-height:1.1;margin:18px 0 10px}
  .cl-card p{font-size:17px;line-height:1.6;color:color-mix(in srgb, var(--color-text, #1a1d21) 74%, transparent);margin:0 auto 26px;max-width:44ch}
  .cl-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .cl-home{display:inline-block;margin-top:24px;font-size:13px;color:color-mix(in srgb, var(--color-text,#1a1d21) 55%, transparent);text-decoration:none}
  .cl-home:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="cl-wrap">
    <div class="cl-card">
      <span class="cl-badge">Client Portal · Coming soon</span>
      <h1>Your client login is on the way</h1>
      <p>We're building a dedicated portal where you'll see your campaigns, reports and results in one place. It isn't live yet — but your growth team already is.</p>
      <div class="cl-actions">
        <a class="btn btn-primary" href="contact.html" style="padding:12px 26px">Talk to your team</a>
        <a class="btn btn-secondary" href="index.html" style="padding:12px 26px">Back to site</a>
      </div>
      <a class="cl-home" href="index.html">← brandmarketian.com</a>
    </div>
  </main>
</body>
</html>
